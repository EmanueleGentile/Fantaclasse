<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - Fantaclasse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <div style="width: 24px; cursor: pointer;" onclick="window.location.href='/login'">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <div class="header-logo">
                <div style="margin-top: -2px;">
                    <span class="fanta">CREA</span><br>
                    <span class="classe">PROFILO</span>
                </div>
            </div>
            <div style="width: 24px;"></div>
        </header>

        <main class="app-content">
            {% if errore %}
            <div style="background-color: #ef4444; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 20px;">
                {{ errore }}
            </div>
            {% endif %}

            <div class="section-title">DIVENTA FANTAMISTER</div>
            <form action="/registrati" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: var(--text-light); font-size: 0.8rem; font-weight: 700;">Nome Reale</label>
                    <input type="text" name="name" required style="padding: 12px; border-radius: 8px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-family: 'Montserrat', sans-serif;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: var(--text-light); font-size: 0.8rem; font-weight: 700;">Username</label>
                    <input type="text" name="username" required pattern="[a-zA-Z0-9_]+" style="padding: 12px; border-radius: 8px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-family: 'Montserrat', sans-serif;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: var(--text-light); font-size: 0.8rem; font-weight: 700;">Email</label>
                    <input type="email" name="email" required style="padding: 12px; border-radius: 8px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-family: 'Montserrat', sans-serif;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: var(--text-light); font-size: 0.8rem; font-weight: 700;">Password (Min. 8 caratteri)</label>
                    <input type="password" name="password" minlength="8" required style="padding: 12px; border-radius: 8px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-family: 'Montserrat', sans-serif;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: var(--text-light); font-size: 0.8rem; font-weight: 700;">Conferma Password</label>
                    <input type="password" name="passwordConfirm" minlength="8" required style="padding: 12px; border-radius: 8px; border: none; background-color: rgba(255,255,255,0.1); color: white; font-family: 'Montserrat', sans-serif;">
                </div>

                <button type="submit" style="margin-top: 10px; background-color: var(--green-primary); color: var(--bg-dark); border: none; padding: 15px; border-radius: 8px; font-weight: 800; font-family: 'Montserrat', sans-serif; cursor: pointer;">
                    REGISTRATI ORA
                </button>
            </form>
        </main>
    </div>
</body>
</html>
