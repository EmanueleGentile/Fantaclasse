<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="chalk-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#C5F36A" fill-opacity="0.12"/>
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <linearGradient id="pitch-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0F1D2E"/>
      <stop offset="100%" stop-color="#091520"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#pitch-glow)"/>
  <rect width="1440" height="900" fill="url(#chalk-grid)"/>
  <g stroke="#C5F36A" stroke-opacity="0.14" stroke-width="2" fill="none">
    <rect x="80" y="50" width="1280" height="800" rx="24"/>
    <line x1="80" y1="316" x2="1360" y2="316" stroke-dasharray="10 8"/>
    <line x1="80" y1="583" x2="1360" y2="583" stroke-dasharray="10 8"/>
    <circle cx="720" cy="450" r="110"/>
    <circle cx="720" cy="450" r="6" fill="#C5F36A" fill-opacity="0.25"/>
  </g>
</svg>
