<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="chalk-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#172033" stroke-width="0.5" stroke-opacity="0.035"/>
      <path d="M 32 0 L 32 64 M 0 32 L 64 32" fill="none" stroke="#19865B" stroke-width="0.4" stroke-dasharray="2 6" stroke-opacity="0.04"/>
    </pattern>

    <radialGradient id="pitch-lime-glow" cx="85%" cy="12%" r="48%">
      <stop offset="0%" stop-color="#C5F36A" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#19865B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F5F7F4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pitch-emerald-glow" cx="12%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#19865B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5F7F4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="#F5F7F4"/>
  <rect width="1440" height="900" fill="url(#chalk-grid)"/>
  <rect width="1440" height="900" fill="url(#pitch-lime-glow)"/>
  <rect width="1440" height="900" fill="url(#pitch-emerald-glow)"/>

  <!-- Subtle architectural pitch markings -->
  <g stroke="#172033" stroke-opacity="0.035" fill="none" stroke-width="1.25">
    <rect x="96" y="64" width="1248" height="772" rx="16"/>
    <line x1="720" y1="64" x2="720" y2="836"/>
    <circle cx="720" cy="450" r="104"/>
    <circle cx="720" cy="450" r="3" fill="#19865B" fill-opacity="0.08"/>
    <rect x="96" y="250" width="160" height="400"/>
    <rect x="1184" y="250" width="160" height="400"/>
  </g>
</svg>
