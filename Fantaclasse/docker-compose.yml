version: '3.8'

services:
  web:
    build: .
    container_name: fantaclasse_web
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - db
    environment:
      - POCKETBASE_URL=http://db:8090
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - fantaclasse-net
    restart: unless-stopped

  db:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: fantaclasse_db
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks:ro
    networks:
      - fantaclasse-net
    restart: unless-stopped

  # --- SERVIZIO PER IL PORTALE SITO WEB ---
  sito_web:
    image: nginx:alpine
    container_name: fantaclasse_sito
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./sito:/usr/share/nginx/html:ro
    networks:
      - fantaclasse-net
    restart: unless-stopped

networks:
  fantaclasse-net:
    driver: bridge

